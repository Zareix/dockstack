name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Docker
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: zareix/gh-actions/.github/workflows/docker.yml@main
    with:
      tag: ${{ github.ref_name }}
      push-image: true

  release:
    name: Create release
    needs: docker
    permissions:
      contents: write
    uses: zareix/gh-actions/.github/workflows/release.yml@main
    with:
      tag: ${{ github.ref_name }}
