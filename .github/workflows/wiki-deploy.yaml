name: Deploy wiki

on:
  push:
    branches:
      - main
    paths:
      - wiki/**
      - internal/**
      - cmd/openapi-gen/**
      - .github/workflows/wiki-deploy.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: bun install --frozen-lockfile
      - run: go run ./cmd/openapi-gen wiki/openapi.yaml
      - run: bun run wiki:build
      - run: touch wiki/out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: wiki/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
